name: Live check

# The release, checked from outside once it is live: the read-only part of the
# public-pages suite (tests tagged @live in e2e-public/) and Lighthouse,
# pointed at https://cams.skylar.technology, and /health must name the release
# just cut. kube-setup's "public web pages" baseline
# (docs/cluster-deployment-requirements.md §4), after
# klaushofrichter/www-skylar-technology and christina.art.
#
# deploy-production.yml already smoke-tests with curl from the in-cluster
# runner; this adds what curl can't see (four real browsers, every public link
# followed, accessibility with contrast on the real pixels, Lighthouse). A
# browser can't run on the in-cluster runner, so this runs on GitHub's, after
# each successful deploy and once a day, so a site that breaks between
# releases is noticed too.
#
# Signed out and read-only: @live tests only GET, never sign in and never
# POST (e2e-public/helpers.ts fails any test whose pages send anything else).
# Nothing here touches a camera, a stream, cam-proxy, cams-admin or /mcp. The
# daily run starts from main: merge the suite and its fixes to main and
# release them together.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
  schedule:
    - cron: '41 11 * * *'   # 05:41 Chicago (CST), outside the busy hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    # After a deploy only if it succeeded; a failed deploy cut no release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://cams.skylar.technology
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: npm ci (retried on a network error)
        run: for i in 1 2 3; do npm ci && exit 0; echo "try $i failed"; sleep 10; done; exit 1

      # The newest release is what must be live: after a deploy it is the one
      # that deploy cut (the release step runs after the rollout).
      - name: Which release should be live
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "expecting ${tag}"

      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      - name: Walk the live public pages in four browsers
        env:
          CI: 'true'
          EXPECT_VERSION: ${{ steps.rel.outputs.version }}
        run: npx playwright test --config playwright.public.config.ts --grep @live

      - name: Lighthouse (Google PageSpeed) on the live start page
        run: scripts/lighthouse-gate.sh https://cams.skylar.technology/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-check-reports
          path: |
            playwright-report-public/
            test-results-public/
            lighthouse-report.report.html
          retention-days: 30
