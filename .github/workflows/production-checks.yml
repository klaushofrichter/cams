name: PR checks

on:
  pull_request:
    branches: [main, production]

# Least privilege for the PR checks; the codeql job asks for more itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: npm ci (retried on a network error)
        run: for i in 1 2 3; do npm ci && exit 0; echo "try $i failed"; sleep 10; done; exit 1
      # ffmpeg (thumbnail tests) from a GitHub release, not apt.
      - uses: ./.github/actions/ffmpeg
      # Type-check the server, test/ and e2e/ (tsconfig.check.json); the
      # build only covers server/ and `check` only web/.
      - run: npm run lint:types
      - run: npm test
      # The vendored cams-v1 contract equals cams-admin's (SOURCE names the branch).
      - name: contract-drift
        run: scripts/contract/cams-v1-drift.sh
      # Build every artifact in PR checks: the server, the web bundle, and a
      # tsc type check of web/ (svelte-check for .svelte files below).
      - run: npm run build
      - run: npm run check
      # Template errors in .svelte files (tsc doesn't read them). Pinned; run
      # through npx because svelte-check doesn't accept TypeScript 7 yet, with
      # the lockfile's svelte (scripts/check-svelte.sh).
      - run: npm run check:svelte
      - run: npm audit --audit-level=high

  e2e:
    # GitHub-hosted only: a browser on the self-hosted runner gets OOM-killed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: npm ci (retried on a network error)
        run: for i in 1 2 3; do npm ci && exit 0; echo "try $i failed"; sleep 10; done; exit 1
      # ffmpeg (thumbnail tests) from a GitHub release, not apt.
      - uses: ./.github/actions/ffmpeg
      # MediaMTX: the sims' RTSP, which the real cam-proxy's go2rtc reads for
      # Silo's live video (without it cam-sim starts with no RTSP).
      - uses: ./.github/actions/mediamtx
      - run: npm run build
      # playwright.config.ts starts the built server with e2e/env.ts values.
      # Which browser `channel: 'chrome'` actually launches on this runner.
      - run: google-chrome --version || echo "no google-chrome on PATH"
      # Silo's real cam-proxy (e2e/realProxy.ts): the released image pinned in
      # e2e/env.ts, pulled here so a pull failure shows as its own step.
      - name: Pull the cam-proxy image
        run: |
          TAG=$(sed -n "s/^export const CAM_PROXY_TAG = '\(.*\)';$/\1/p" e2e/env.ts)
          DIGEST=$(sed -n "s/^export const CAM_PROXY_DIGEST = '\(.*\)';$/\1/p" e2e/env.ts)
          [ -n "$TAG" ] || { echo "::error::CAM_PROXY_TAG not found in e2e/env.ts"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::CAM_PROXY_DIGEST not found (or malformed) in e2e/env.ts"; exit 1; }
          # The pulled reference is the tag pinned by digest, as realProxy.ts runs it.
          docker pull "ghcr.io/klaushofrichter/cam-proxy:$TAG@$DIGEST"
      - run: npm run test:e2e
        env:
          CI: 'true'
      # The PUBLIC pages (signed out: /, /signin, /token, the 404 page), by
      # kube-setup's "public web pages" baseline (docs/cluster-deployment-
      # requirements.md §4): the Docker image this commit builds, the artifact
      # the deploy ships, in four browsers (desktop Chrome, a Pixel, an iPhone
      # in WebKit, desktop Firefox; playwright.public.config.ts, e2e-public/),
      # then Lighthouse on a phone profile. In this job, so the required check
      # stays the single `e2e`. GitHub's runners only: a browser OOM-kills the
      # in-cluster runner.
      - name: Build and start the image (public pages)
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=2099.01.01.1 -t cams:public-e2e .
          # The cloud's Google sign-in and no cameras: what a signed-out
          # visitor sees doesn't depend on them. None of these are real.
          docker run -d --name cams-public -p 8072:8080 \
            -e COOKIE_SECRET=e2e-public-cookie-secret-not-used-for-anything \
            -e GOOGLE_CLIENT_ID=e2e -e GOOGLE_CLIENT_SECRET=e2e \
            -e GOOGLE_REDIRECT_URI=http://localhost:8072/auth/google/callback \
            -e ALLOWED_EMAILS=nobody@e2e.example \
            -e PREFS_FILE=/tmp/prefs.json -e PROXY_STATE_FILE=/tmp/proxy-state.json -e PROXY_FEATURES_FILE=/tmp/proxy-features.json \
            cams:public-e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8072/health >/dev/null && break
            echo "waiting for the image (${i}/30)"; sleep 1
          done
          curl -sf http://localhost:8072/health | grep -q '"version":"2099.01.01.1"' \
            || { echo "::error::the image did not come up with the stamped version"; docker logs cams-public; exit 1; }
      # `--with-deps` runs `apt-get update`, which also reads the Google Chrome
      # source the runner image ships; one bad index there fails the whole job
      # (art, 2026-09-09), so drop that source. Chrome itself stays: the suite
      # above and Lighthouse below use it.
      - name: Install the browsers (public pages)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox
      # failOnFlakyTests (playwright.public.config.ts) fails this step if any
      # test passed only on its retry.
      - name: Walk the public pages in four browsers
        env:
          CI: 'true'
          BASE_URL: http://localhost:8072
          EXPECT_VERSION: 2099.01.01.1
        run: npx playwright test --config playwright.public.config.ts
      - name: Lighthouse (Google PageSpeed) on a phone
        run: scripts/lighthouse-gate.sh http://localhost:8072/
      # Traces, screenshots and error context of failed tests.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: |
            test-results/
            test-results-public/
            playwright-report-public/
            lighthouse-report.report.html
          retention-days: 7
      - name: Server log of the public-pages image when something failed
        if: failure()
        run: docker logs cams-public || true

  # The Video specs at fixed Chicago times of day (00:30 to 23:50, the
  # runner's UTC a day ahead too), each with the whole stack's clock moved
  # there (scripts/e2e-time-of-day.ts, issue #213): a spec that only passes
  # at some hours fails here whenever the PR runs.
  e2e-time-of-day:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: npm ci (retried on a network error)
        run: for i in 1 2 3; do npm ci && exit 0; echo "try $i failed"; sleep 10; done; exit 1
      # ffmpeg (the fake cam-proxy's media) from a GitHub release, not apt.
      - uses: ./.github/actions/ffmpeg
      - run: npm run build
      - run: npm run test:e2e:times
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-time-of-day-results
          path: test-results/
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never
      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          accepted=.github/codeql-accepted.tsv
          blocking=0
          for f in sarif-results/*.sarif; do
            while IFS=$'\t' read -r rule uri line message; do
              [ -n "$rule" ] || continue
              if grep -v '^#' "$accepted" | awk -F'\t' -v r="$rule" -v p="$uri" '$1==r && $2==p {found=1} END {exit !found}'; then
                echo "::notice::CodeQL $rule at $uri:$line — accepted exception, see $accepted"
              else
                echo "::error::CodeQL $rule — $message"
                echo "    at $uri:$line"
                blocking=$((blocking + 1))
              fi
            done < <(jq -r '.runs[].results[]
              | select((.suppressions // []) | length == 0)
              | [.ruleId,
                 .locations[0].physicalLocation.artifactLocation.uri,
                 (.locations[0].physicalLocation.region.startLine | tostring),
                 .message.text] | @tsv' "$f")
          done
          echo "CodeQL blocking findings: $blocking"
          [ "$blocking" -eq 0 ] || { echo "::error::CodeQL found $blocking unaccepted finding(s)"; exit 1; }
