name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # ffmpeg (thumbnail tests) from a GitHub release, not apt.
      - uses: ./.github/actions/ffmpeg
      - run: |
          npm ci
          npm test
      # amd64 for the cluster, arm64 for the Pi demo kit (docs/pi-demo.md).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build timestamp
        id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=main
            BUILD_DATE=${{ steps.built.outputs.at }}
          # :main ONLY. deploy-production.yml is the sole writer of :<sha>,
          # :v<version> and :latest; a second writer could replace the image
          # under the ksvc's :<sha> pin.
          tags: |
            ghcr.io/klaushofrichter/cams:main
