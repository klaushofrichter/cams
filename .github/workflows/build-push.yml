name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Ensure ffmpeg (thumbnail tests)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: |
          npm ci
          npm test
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=main
          # :main ONLY. deploy-production.yml is the sole writer of :<sha>,
          # :v<version> and :latest; a second writer could replace the image
          # under the ksvc's :<sha> pin.
          tags: |
            ghcr.io/klaushofrichter/cams:main
