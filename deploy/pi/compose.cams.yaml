# cams on the cam-proxy Raspberry Pi: the demo kit (docs/pi-demo.md).
# Its own directory and compose project, next to cam-proxy's: on our Pi
# /srv/cam-proxy/cams (no sudo). In it:
#   compose.yaml   this file
#   cameras.json   the camera, "host": "from-proxy" (deploy/pi/cameras.example.json; readable by uid 1000)
#   data/          preferences, the proxy switch and the clip cache (writable by uid 1000)
#   .env           optional: CAMS_TAG only, to pin a release
# The secrets (CAMS_LOGIN_TOKEN, COOKIE_SECRET) are in the Pi's one file,
# cam-proxy's /srv/cam-proxy/.env (../.env), next to CAMERA_HOST and
# PI_ADDRESS. cams takes the camera's address from cam-proxy.
# Paths below are relative to this file.
# Update: docker compose pull && docker compose up -d
#
# Host networking, like cam-proxy: cams reaches cam-proxy at
# http://127.0.0.1:8480 and listens on the Pi's port 8080 itself
# (http://<pi>:8080 on the LAN, http://127.0.0.1:8080 on the Pi).
services:
  cams:
    image: ghcr.io/klaushofrichter/cams:${CAMS_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    # CAMS_LOGIN_TOKEN and COOKIE_SECRET (required), CAMS_TOKEN_USER (optional,
    # default local). Token sign-in only: no GOOGLE_* variables on the Pi.
    env_file: ../.env
    environment:
      PORT: "8080"
      # Plain http on the LAN: session cookies without Secure (a startup warning says so).
      COOKIE_SECURE: "false"
      CAMERAS_FILE: /config/cameras.json
      PREFS_FILE: /data/preferences.json
      PROXY_STATE_FILE: /data/proxy-state.json
      CACHE_DIR: /data/cache
      # 2 GiB: the SD card is shared with cam-proxy's recordings.
      CACHE_MAX_BYTES: "2147483648"
    volumes:
      - ./cameras.json:/config/cameras.json:ro
      - ./data:/data
